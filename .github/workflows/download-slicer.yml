
name: Download 3D Slicer

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download official installer
        run: |
          curl -fL --retry 3 \
            --output Slicer-Setup.exe \
            "https://slicer-packages.kitware.com/api/v1/item/6aa1db04ce9de556d30112bb/download"

      - name: Verify SHA512
        run: |
          echo "5ba320cb67f0acdaacf0a31380e9cf3b9f46d05f57a53da7e04ebcd9490251ecbe998bfefdbdab1f747e038653177868cdb0ad30986473b9d68efba0f4c6045c  Slicer-Setup.exe" | sha512sum -c -

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Slicer-Windows-5.12.4
          path: Slicer-Setup.exe
          retention-days: 1
